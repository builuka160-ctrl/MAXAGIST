<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAXAGIST · панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0e1116; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
    --fg:#eef1f5; --mut:#9aa4b2; --acc:#c9a24b; --acc2:#6ea8fe; --ok:#4ade80; --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:12px 12px 40px;-webkit-tap-highlight-color:transparent}
  h1{font-size:18px;margin:2px 0 2px}
  .sub{color:var(--mut);font-size:12px;margin:0 0 14px}
  .glass{background:var(--card);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(8px)}
  .tabs{display:flex;gap:8px;margin:0 0 14px}
  .tabs button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;color:var(--fg);
    border-radius:12px;font-weight:600;font-size:14px}
  .tabs button.on{background:var(--acc);color:#1a1400;border-color:var(--acc)}
  .range{display:flex;gap:6px;margin:0 0 12px}
  .range button{padding:7px 12px;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:10px;font-size:13px}
  .range button.on{color:var(--fg);border-color:var(--acc2)}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 14px}
  .kpi{padding:12px 14px}
  .kpi b{display:block;font-size:24px;line-height:1.1}
  .kpi span{color:var(--mut);font-size:12px}
  .block{padding:14px;margin:0 0 12px}
  .block h3{margin:0 0 10px;font-size:14px;color:var(--fg)}
  .bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
  .bar .lb{flex:0 0 42%;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .tr{flex:1;background:rgba(255,255,255,.07);border-radius:6px;height:16px;position:relative;overflow:hidden}
  .bar .fl{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:6px}
  .bar .vl{flex:0 0 auto;color:var(--fg);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:500}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--mut);font-size:13px}
  .field{padding:12px 14px;margin:0 0 12px}
  .field .fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 6px}
  .field .fh b{font-size:14px}
  .field .fh small{color:var(--mut);font-size:11px}
  .field textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--fg);
    border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;resize:vertical;min-height:44px}
  .field .lng{display:flex;align-items:center;gap:8px;margin:6px 0 0}
  .field .lng .tag{flex:0 0 26px;color:var(--mut);font-size:11px;text-transform:uppercase}
  .field .extra{display:none}
  .field.open .extra{display:block}
  .field .row2{display:flex;gap:8px;align-items:center;margin-top:8px}
  .btn{padding:8px 14px;border:0;border-radius:10px;background:var(--acc);color:#1a1400;font-weight:600;font-size:13px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  .save-state{font-size:12px;color:var(--mut)}
  .save-state.ok{color:var(--ok)} .save-state.bad{color:var(--bad)}
  .center{text-align:center;padding:40px 16px;color:var(--mut)}
  .lead{padding:12px 14px;margin:0 0 10px}
  .lead-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .lead-top b{font-size:15px}
  .lead-date{color:var(--mut);font-size:12px;white-space:nowrap}
  .lead-row{margin:6px 0 0;display:flex;gap:14px;flex-wrap:wrap}
  .lead-link{color:var(--acc2);text-decoration:none;font-size:13px}
  .lead-msg{margin:8px 0 0;padding:8px 10px;background:rgba(0,0,0,.22);border-radius:8px;font-size:13px;white-space:pre-wrap;word-break:break-word}
  .lead-meta{margin:8px 0 0;color:var(--mut);font-size:11px}
  .lead-device{margin:6px 0 0;padding-top:6px;border-top:1px solid var(--line);color:var(--mut);font-size:12px}
  .hide{display:none!important}
</style>
</head>
<body>

      <div id="fields"></div>
    </section>

<script>

  "hero.eyebrow":{"ru":"Максим · массаж в Риге, студия и выезд","lv":"Maksims · masāža Rīgā, studija un izbraukums","en":"Maksim · massage in Riga, studio & outcall"},

  "svc.intro":{"ru":"Полный список услуг студии с длительностью. Цены не публикуем — актуальный прайс и PDF-меню пришлём в WhatsApp за пару минут.","lv":"Pilns studijas pakalpojumu saraksts ar ilgumu. Cenas nepublicējam — aktuālo cenrādi un PDF izvēlni atsūtīsim WhatsApp pāris minūtēs.","en":"The full list of studio services with durations. We don’t publish prices — we’ll send the current price list and PDF menu on WhatsApp in a couple of minutes."},

  "about.p":{"ru":"Массаж — не хобби на выходных, а профессия с дипломом. Медицинское образование, диплом RISEBA, международная квалификация ITEC и ещё девять профильных сертификатов — от классического массажа до работы с фасцией.","lv":"Masāža nav brīvdienu hobijs, bet profesija ar diplomu. Medicīniskā izglītība, RISEBA diploms, starptautiskā ITEC kvalifikācija un vēl deviņi nozares sertifikāti — no klasiskās masāžas līdz darbam ar fasciju.","en":"Massage isn’t a weekend hobby but a profession with a diploma. Medical education, a RISEBA diploma, international ITEC qualification and nine more specialist certificates — from classic massage to fascia work."},

const tg = window.Telegram && window.Telegram.WebApp;
const $ = (s, r=document) => r.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if(c) e.className=c; if(txt!=null) e.textContent=txt; return e; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

// initData читаем на каждый запрос: Telegram может обновить его после переоткрытия,
// а значение, снятое один раз при загрузке, к тому времени уже устареет.
function currentInitData(){ try { return (tg && tg.initData) || ''; } catch(e){ return ''; } }
let INIT_DATA = currentInitData();

// Сессия протухла / не подтверждена — показываем понятный экран вместо «unauthorized».
let sessionDead = false;
function showSessionExpired(kind){
  if(sessionDead) return; sessionDead = true;
  $('#app').classList.add('hide');
  const g = $('#gate'); g.classList.remove('hide');
  g.innerHTML =
    (kind==='stale' ? 'Сессия Telegram устарела. ' : 'Не удалось подтвердить доступ. ') +
    'Полностью закройте панель и откройте её заново из меню бота <b>@maxag_bot</b>.' +
    '<br><br><button class="btn" id="reopen-btn">Обновить</button>';
  const b = document.getElementById('reopen-btn');
  if(b) b.onclick = ()=>{ try{ if(tg&&tg.close) return tg.close(); }catch(e){} location.reload(); };
}

async function api(action, extra){
  INIT_DATA = currentInitData() || INIT_DATA;
  let r;
  try {
    r = await fetch(API, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey: SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY },
      body: JSON.stringify(Object.assign({ action, initData: INIT_DATA }, extra||{}))
    });
  } catch(e){ return { ok:false, error:'network' }; }
  const out = await r.json().catch(()=>({ ok:false, error:'bad response' }));
  if(!out.ok && (out.error==='stale' || out.error==='unauthorized')) showSessionExpired(out.error);
  return out;
}

/* ---------- дашборд ---------- */
function bars(items, labelFn, valueFn){
  const wrap = el('div');
  const max = Math.max(1, ...items.map(valueFn));
  if(!items.length){ wrap.appendChild(el('p','muted','Пока нет данных за период.')); return wrap; }
  items.forEach(it => {
    const b = el('div','bar');
    b.appendChild(el('span','lb', labelFn(it)));
    const tr = el('div','tr'); const fl = el('div','fl'); fl.style.width = (valueFn(it)/max*100)+'%';
    tr.appendChild(fl); b.appendChild(tr);
    b.appendChild(el('span','vl', String(valueFn(it))));
    wrap.appendChild(b);
  });
  return wrap;
}
function block(title, node){
  const b = el('div','block glass'); b.appendChild(el('h3',null,title)); b.appendChild(node); return b;
}
function fmtSec(s){ s=Number(s||0); return s>=60 ? (s/60).toFixed(1)+' мин' : Math.round(s)+' с'; }

function renderDash(st){
  const k = st.totals||{};
  const kpis = $('#kpis'); kpis.innerHTML='';
  [['Посетители',k.visitors],['Сессии',k.sessions],['Просмотры',k.pageviews],['Событий',k.events]].forEach(([n,v])=>{
    const c = el('div','kpi glass'); c.appendChild(el('b',null,String(v??0))); c.appendChild(el('span',null,n)); kpis.appendChild(c);
  });

  const body = $('#dash-body'); body.innerHTML='';

  body.appendChild(block('Что и куда жмут',
    bars(st.top_clicks||[], x=>x.label, x=>x.hits)));

  // время на странице
  const tt = el('table');
  tt.innerHTML = '<tr><th>Страница</th><th class="n">Просм.</th><th class="n">Активно</th><th class="n">Всего</th></tr>' +
    (st.time_on_page||[]).map(p=>`<tr><td>${esc(p.path)}</td><td class="n">${p.views}</td><td class="n">${fmtSec(p.avg_active_sec)}</td><td class="n">${fmtSec(p.avg_total_sec)}</td></tr>`).join('');
  body.appendChild(block('Сколько времени проводят', (st.time_on_page||[]).length ? tt : el('p','muted','Нет данных.')));

  body.appendChild(block('Секции, которые видят',
    bars(st.sections||[], x=>x.section, x=>x.sessions)));

  body.appendChild(block('Источники переходов',
    bars(st.sources||[], x=>x.src, x=>x.sessions)));

  // по дням
  const dt = el('table');
  dt.innerHTML = '<tr><th>Дата</th><th class="n">Посет.</th><th class="n">Сессии</th><th class="n">Просм.</th></tr>' +
    (st.by_day||[]).map(d=>`<tr><td>${esc(d.d)}</td><td class="n">${d.visitors}</td><td class="n">${d.sessions}</td><td class="n">${d.pageviews}</td></tr>`).join('');
  body.appendChild(block('По дням', (st.by_day||[]).length ? dt : el('p','muted','Нет данных.')));

  // глубина скролла (агрегируем по вехам)
  const sd = {}; (st.scroll||[]).forEach(s=>{ sd[s.depth]=(sd[s.depth]||0)+s.n; });
  const sdArr = Object.keys(sd).map(d=>({depth:+d,n:sd[d]})).sort((a,b)=>a.depth-b.depth);
  body.appendChild(block('Глубина прокрутки',
    bars(sdArr, x=>x.depth+'%', x=>x.n)));
}

let curDays = 7;
async function loadDash(){
  $('#dash-body').innerHTML = '<p class="muted">Загрузка…</p>';
  const res = await api('stats', { days: curDays });
  if(!res.ok){ $('#dash-body').innerHTML = '<p class="muted">Ошибка: '+esc(res.error)+'</p>'; return; }
  renderDash(res.stats||{});
}

/* ---------- заявки (лиды) ---------- */
function fmtDate(iso){
  const dt = new Date(iso);
  if (isNaN(dt)) return esc(iso||'');
  return dt.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function leadWa(phone){ const d = String(phone||'').replace(/[^\d]/g,''); return d ? 'https://wa.me/'+d : null; }
// Понятное описание устройства из User-Agent: «📱 iPhone · Safari» и т.п.
function deviceFromUA(ua){
  ua = String(ua||'');
  if(!ua) return null;
  let os='';
  if(/iPhone/i.test(ua)) os='iPhone';
  else if(/iPad/i.test(ua)) os='iPad';
  else if(/Android/i.test(ua)){ const m=ua.match(/Android[ ;]([\d.]+)/i); os='Android'+(m?' '+m[1]:''); }
  else if(/Windows NT/i.test(ua)) os='Windows';
  else if(/Mac OS X/i.test(ua)) os='Mac';
  else if(/CrOS/i.test(ua)) os='ChromeOS';
  else if(/Linux/i.test(ua)) os='Linux';
  let br='';
  if(/Edg\//i.test(ua)) br='Edge';
  else if(/OPR\//i.test(ua)||/Opera/i.test(ua)) br='Opera';
  else if(/CriOS/i.test(ua)) br='Chrome';
  else if(/Chrome\//i.test(ua) && !/Chromium/i.test(ua)) br='Chrome';
  else if(/FxiOS/i.test(ua)||/Firefox\//i.test(ua)) br='Firefox';
  else if(/Version\//i.test(ua) && /Safari/i.test(ua)) br='Safari';
  const mobile=/Mobi|Android|iPhone|iPad/i.test(ua);
  const label=[os,br].filter(Boolean).join(' · ')||'неизвестно';
  return (mobile?'📱 ':'💻 ')+label;
}

function renderLeads(list, total){
  const body = $('#leads-body'); body.innerHTML='';
  body.appendChild(el('p','muted','Всего заявок: '+total));
  if(!list.length){ body.appendChild(el('p','center','Пока никто не заполнял форму на сайте.')); return; }
  list.forEach(l=>{
    const c = el('div','lead glass');
    const top = el('div','lead-top');
    top.appendChild(el('b',null, l.name||'—'));
    top.appendChild(el('span','lead-date', fmtDate(l.received_at)));
    c.appendChild(top);

    if(l.phone){
      const row = el('div','lead-row');
      const tel = el('a','lead-link'); tel.href='tel:'+String(l.phone).replace(/\s/g,''); tel.textContent='📞 '+l.phone;
      row.appendChild(tel);
      const wa = leadWa(l.phone);
      if(wa){ const a = el('a','lead-link'); a.href=wa; a.target='_blank'; a.rel='noopener'; a.textContent='WhatsApp ↗'; row.appendChild(a); }
      c.appendChild(row);
    }
    if(l.email){
      const row = el('div','lead-row');
      const a = el('a','lead-link'); a.href='mailto:'+l.email; a.textContent='✉️ '+l.email;
      row.appendChild(a); c.appendChild(row);
    }
    if(l.message) c.appendChild(el('div','lead-msg', l.message));
    const meta = [l.source && ('источник: '+l.source), l.path].filter(Boolean).join('  ·  ');
    if(meta) c.appendChild(el('div','lead-meta', meta));
    const device = deviceFromUA(l.user_agent);
    if(device) c.appendChild(el('div','lead-device', 'Устройство: '+device));
    body.appendChild(c);
  });
}
async function loadLeads(){
  $('#leads-body').innerHTML = '<p class="muted">Загрузка…</p>';
  const res = await api('leads', { limit: 200 });
  if(!res.ok){ $('#leads-body').innerHTML = '<p class="muted">Ошибка: '+esc(res.error)+'</p>'; return; }
  renderLeads(res.leads||[], res.total||0);
}

/* ---------- редактор ---------- */
function renderFields(content){
  const map = {}; (content||[]).forEach(r=>{ map[r.key]=r.value||{}; });
  const box = $('#fields'); box.innerHTML='';
  FIELDS.forEach(f=>{
    const v = map[f.key] || {};
    const d = DEFAULTS[f.key] || {};              // текущий текст сайта
    const card = el('div','field glass');
    const fh = el('div','fh');
    fh.appendChild(el('b',null,f.label));
    fh.appendChild(el('small',null,f.key + (f.html?' · html':'')));
    card.appendChild(fh);

    // предзаполняем текущим текстом сайта (или ранее сохранённым изменением)
    const ru = el('textarea'); ru.value = v.ru!=null?v.ru:(d.ru||''); ru.placeholder=d.ru||'RU (основной)'; ru.dataset.l='ru';
    card.appendChild(ru);

    const extra = el('div','extra');
    ['lv','en'].forEach(l=>{
      const row = el('div','lng'); row.appendChild(el('span','tag',l));
      const ta = el('textarea'); ta.value = v[l]!=null?v[l]:(d[l]||''); ta.dataset.l=l; ta.placeholder=d[l]||l.toUpperCase();
      row.appendChild(ta); extra.appendChild(row);
    });
    card.appendChild(extra);

    const row2 = el('div','row2');
    const toggle = el('button','btn ghost','LV / EN');
    toggle.onclick = ()=> card.classList.toggle('open');
    const reset = el('button','btn ghost','↺ как на сайте');
    reset.onclick = ()=>{ card.querySelectorAll('textarea').forEach(t=>{ t.value = d[t.dataset.l]||''; }); };
    const save = el('button','btn','Сохранить');
    const state = el('span','save-state','');
    save.onclick = async ()=>{
      state.className='save-state'; state.textContent='…';
      // в базу пишем только то, что отличается от текста сайта (совпадающее = «по умолчанию»)
      const value = {};
      card.querySelectorAll('textarea').forEach(t=>{
        const val = t.value.trim(); const def = (d[t.dataset.l]||'').trim();
        if(val && val!==def) value[t.dataset.l]=val;
      });
      const res = await api('content_set', { key: f.key, value });
      if(res.ok){ state.className='save-state ok'; state.textContent=Object.keys(value).length?'сохранено':'сброшено на сайт'; if(tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); }
      else { state.className='save-state bad'; state.textContent='ошибка: '+(res.error||''); }
    };
    row2.appendChild(toggle); row2.appendChild(reset); row2.appendChild(save); row2.appendChild(state);
    card.appendChild(row2);
    box.appendChild(card);
  });
}
async function loadEditor(){
  $('#fields').innerHTML = '<p class="muted">Загрузка…</p>';
  const res = await api('content_get');
  if(res.ok) renderFields(res.content||[]);
  else $('#fields').innerHTML = '<p class="muted">Ошибка: '+esc(res.error)+'</p>';
}

/* ---------- init ---------- */
function switchTab(which){
  ['dash','leads','edit'].forEach(t=>{
    $('#tab-'+t).classList.toggle('on', which===t);
    $('#view-'+t).classList.toggle('hide', which!==t);
  });
}

(async function(){
  try { if(tg){ tg.ready(); tg.expand(); } } catch(e){}
  if(!INIT_DATA){
    $('#gate').innerHTML = 'Откройте панель через Telegram-бота <b>@maxag_bot</b> (кнопка меню).';
    return;
  }
  const me = await api('me');
  if(!me.ok){
    // stale/unauthorized уже показал showSessionExpired — не перетираем его сообщение.
    if(me.error!=='stale' && me.error!=='unauthorized')
      $('#gate').innerHTML = me.error==='forbidden'
        ? 'Нет доступа. Ваш ID: <b>'+esc(me.id)+'</b> — попросите владельца добавить его.'
        : 'Ошибка: '+esc(me.error||'');
    return;
  }
  $('#gate').classList.add('hide');
  $('#app').classList.remove('hide');
  $('#who').textContent = (me.name||'') + ' · ' + (me.role==='admin'?'полный доступ':'просмотр');

  if(me.role==='admin') $('#tab-edit').classList.remove('hide');

  $('#tab-dash').onclick = ()=> switchTab('dash');
  $('#tab-leads').onclick = ()=>{ switchTab('leads'); loadLeads(); };
  $('#tab-edit').onclick = ()=>{ switchTab('edit'); loadEditor(); };
  $('#range').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ $('#range').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); curDays=+b.dataset.d; loadDash(); };
  });

  loadDash();
})();
</script>
